<g class="node code"><rect x="110" y="130" width="210" height="130" rx="10"/><text class="t" x="215" y="165.5" text-anchor="middle">stamp current?</text><text class="s" x="215" y="182.5" text-anchor="middle">TICK</text><text class="l" x="215" y="203.5" text-anchor="middle">written in the last 24 h</text><text class="l" x="215" y="219.5" text-anchor="middle">for this factory version</text><text class="l" x="215" y="235.5" text-anchor="middle">and this stages.yml</text></g>
<g class="node code"><rect x="400" y="130" width="180" height="130" rx="10"/><text class="t" x="490" y="165.5" text-anchor="middle">tools</text><text class="s" x="490" y="182.5" text-anchor="middle">CHECK 1</text><text class="l" x="490" y="203.5" text-anchor="middle">git, gh, uv, make</text><text class="l" x="490" y="219.5" text-anchor="middle">on the PATH</text><text class="l" x="490" y="235.5" text-anchor="middle">fix: install them</text></g>
<g class="node code"><rect x="610" y="130" width="180" height="130" rx="10"/><text class="t" x="700" y="165.5" text-anchor="middle">git identity</text><text class="s" x="700" y="182.5" text-anchor="middle">CHECK 2</text><text class="l" x="700" y="203.5" text-anchor="middle">user.name and</text><text class="l" x="700" y="219.5" text-anchor="middle">user.email set</text><text class="l" x="700" y="235.5" text-anchor="middle">fix: git config</text></g>
