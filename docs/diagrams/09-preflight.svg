<text class="title" x="40" y="46">09 · The preflight: can this machine run the loop?</text>
<text class="subtitle" x="40" y="70">Run by the tick before anything else. It checks the machine, not the code, and never installs anything itself.</text>
<g class="node code"><rect x="40" y="486" width="26" height="16" rx="4"/></g>
