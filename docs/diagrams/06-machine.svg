</style><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-flow" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-back" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-ask" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-ask" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-stall" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-stall" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="2240" height="560"/>
<text class="title" x="40" y="46">06 · The machine: one container, repositories in turn</text>
<text class="subtitle" x="40" y="70">entrypoint.sh owns a checkout of every repository in REPOS and ticks them one after another, round after round.</text>
<g class="node code"><rect x="40" y="528" width="26" height="16" rx="4"/></g>
<text class="note" x="74" y="540">deterministic code, no model</text>
<g class="node quiet"><rect x="282" y="528" width="26" height="16" rx="4"/></g>
<text class="note" x="316" y="540">nothing happens</text>
<path class="e e-flow" d="M 433 536 L 459 536" marker-end="url(#a-flow)"/>
<text class="note" x="467" y="540">moves on</text>
<path class="e e-back" d="M 535 536 L 561 536" marker-end="url(#a-back)"/>
<text class="note" x="569" y="540">loops</text>
<path class="e e-flow" d="M 20 234 L 110 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 300 234 L 380 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 570 234 L 670 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 860 234 L 940 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1130 234 L 1210 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1350 234 L 1430 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1620 234 L 1700 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1850 234 L 1940 234" marker-end="url(#a-flow)"/>
<path class="e e-stall" d="M 1280 289 L 1280 350" marker-end="url(#a-stall)"/>
<path class="e e-stall" d="M 1380 398 L 1765 398 Q 1775 398 1775 388 L 1775 289" marker-end="url(#a-stall)"/>
<path class="e e-back" d="M 1775 179 L 1775 128 Q 1775 118 1765 118 L 775 118 Q 765 118 765 128 L 765 170" marker-end="url(#a-back)"/>
<path class="e e-back" d="M 2065 298 L 2065 480 Q 2065 490 2055 490 L 775 490 Q 765 490 765 480 L 765 298" marker-end="url(#a-back)"/>
<g class="node code"><rect x="110" y="170" width="190" height="128" rx="10"/><text class="t" x="205" y="204.5" text-anchor="middle">set up</text><text class="s" x="205" y="221.5" text-anchor="middle">ENTRYPOINT</text><text class="l" x="205" y="242.5" text-anchor="middle">skills, agents, allow</text><text class="l" x="205" y="258.5" text-anchor="middle">list into ~/.claude;</text><text class="l" x="205" y="274.5" text-anchor="middle">git identity, gh auth</text></g>
<g class="node code"><rect x="380" y="170" width="190" height="128" rx="10"/><text class="t" x="475" y="204.5" text-anchor="middle">clear leftovers</text><text class="s" x="475" y="221.5" text-anchor="middle">ENTRYPOINT</text><text class="l" x="475" y="242.5" text-anchor="middle">tick and git index</text><text class="l" x="475" y="258.5" text-anchor="middle">locks, the tick memo;</text><text class="l" x="475" y="274.5" text-anchor="middle">start time noted</text></g>
<g class="node code"><rect x="670" y="170" width="190" height="128" rx="10"/><text class="t" x="765" y="212.5" text-anchor="middle">next repository</text><text class="s" x="765" y="229.5" text-anchor="middle">ENTRYPOINT</text><text class="l" x="765" y="250.5" text-anchor="middle">from REPOS, in</text><text class="l" x="765" y="266.5" text-anchor="middle">the order given</text></g>
<g class="node code"><rect x="940" y="170" width="190" height="128" rx="10"/><text class="t" x="1035" y="204.5" text-anchor="middle">prepare</text><text class="s" x="1035" y="221.5" text-anchor="middle">ENTRYPOINT</text><text class="l" x="1035" y="242.5" text-anchor="middle">clone into /work if</text><text class="l" x="1035" y="258.5" text-anchor="middle">missing; follow main</text><text class="l" x="1035" y="274.5" text-anchor="middle">until it is set up</text></g>
<g class="node code"><polygon points="1280.0,179.0 1350,234.0 1280.0,289.0 1210,234.0"/><text class="l" x="1280" y="240.5" text-anchor="middle">ready?</text></g>
<g class="node code"><rect x="1430" y="170" width="190" height="128" rx="10"/><text class="t" x="1525" y="212.5" text-anchor="middle">factory-tick</text><text class="s" x="1525" y="229.5" text-anchor="middle">SEE 07</text><text class="l" x="1525" y="250.5" text-anchor="middle">one tick in this</text><text class="l" x="1525" y="266.5" text-anchor="middle">repository&#x27;s checkout</text></g>
<g class="node code"><polygon points="1775.0,179.0 1850,234.0 1775.0,289.0 1700,234.0"/><text class="l" x="1775" y="232.5" text-anchor="middle">more</text><text class="l" x="1775" y="248.5" text-anchor="middle">repositories?</text></g>
<g class="node code"><rect x="1940" y="170" width="250" height="128" rx="10"/><text class="t" x="2065" y="204.5" text-anchor="middle">wait</text><text class="s" x="2065" y="221.5" text-anchor="middle">ENTRYPOINT</text><text class="l" x="2065" y="242.5" text-anchor="middle">2 s if a tick dispatched</text><text class="l" x="2065" y="258.5" text-anchor="middle">(exit 3), otherwise</text><text class="l" x="2065" y="274.5" text-anchor="middle">TICK_SECONDS (120 s)</text></g>
<g class="node quiet"><rect x="1180" y="350" width="200" height="96" rx="10"/><text class="t" x="1280" y="376.5" text-anchor="middle">skip it</text><text class="s" x="1280" y="393.5" text-anchor="middle">LOGGED ONCE</text><text class="l" x="1280" y="414.5" text-anchor="middle">empty, no stages.yml</text><text class="l" x="1280" y="430.5" text-anchor="middle">yet, or uv sync failed</text></g>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="65" y="209">compose</tspan><tspan x="65" y="224">up</tspan></text>

<text class="lbl lbl-flow" text-anchor="middle"><tspan x="620" y="210">once per</tspan><tspan x="620" y="225">start</tspan></text>


<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1390" y="225">yes</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1660" y="210">exit 0, 1</tspan><tspan x="1660" y="225">or 3</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1895" y="210">no: round</tspan><tspan x="1895" y="225">done</tspan></text>
<text class="lbl lbl-stall" text-anchor="start"><tspan x="1289" y="323.5">no</tspan></text>
<text class="lbl lbl-stall" text-anchor="middle"><tspan x="1577.5" y="389">on to the next</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="1270" y="110">yes: the next repository</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="1415" y="482">next round</tspan></text>
</svg>
