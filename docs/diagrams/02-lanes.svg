<rect class="bg" width="2732" height="892"/>
<text class="title" x="40" y="46">02 · Lanes: where each stage writes</text>
<text class="subtitle" x="40" y="70">One row per lane from stages.yml; each stage sits in the row of what it produces. The guard hook refuses every write outside the agent&#x27;s lane.</text>
<rect class="lane-alt" x="40" y="110" width="2652" height="112"/>
<text class="lane-head" x="56" y="163">Human</text>
<text class="lane-note" x="56" y="181">drafts/, merge or close</text>
<rect class="lane" x="40" y="222" width="2652" height="112"/>
<text class="lane-head" x="56" y="275">Pull request</text>
<text class="lane-note" x="56" y="293">GitHub, written with gh</text>
<rect class="lane-alt" x="40" y="334" width="2652" height="112"/>
<text class="lane-head" x="56" y="387">tests/*</text>
<text class="lane-note" x="56" y="405">tester</text>
<rect class="lane" x="40" y="446" width="2652" height="112"/>
<text class="lane-head" x="56" y="499">src/*, docs/openapi.json</text>
<text class="lane-note" x="56" y="517">coder</text>
<rect class="lane-alt" x="40" y="558" width="2652" height="112"/>
<text class="lane-head" x="56" y="611">Story file</text>
<text class="lane-note" x="56" y="629">ongoing/*.md: every agent</text>
<rect class="lane" x="40" y="670" width="2652" height="112"/>
<text class="lane-head" x="56" y="723">README.md, docs/*</text>
<text class="lane-note" x="56" y="741">documenter</text>
<rect x="320" y="808" width="358" height="26" rx="4" class="band-main"/>
<rect x="678" y="808" width="1656" height="26" rx="4" class="band-ticket"/>
<rect x="2334" y="808" width="358" height="26" rx="4" class="band-main"/>
<text class="lane-head" x="56" y="826">Branch</text>
<text class="note" x="334" y="826">main</text>
<text class="note" x="692" y="826">ticket/&lt;stem&gt;, one per story: every stage commits code and story together and pushes; it comes back to main only through the merge</text>
<text class="note" x="2348" y="826">main</text>
