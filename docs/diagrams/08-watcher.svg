<rect class="bg" width="2520" height="690"/>
<text class="title" x="40" y="46">08 · The watcher: one line, first match wins</text>
<text class="subtitle" x="40" y="70">factory-watch reads, never writes. Each check looks at every ongoing story and due acceptance in id order; the first that matches decides the line.</text>
<g class="node code"><rect x="40" y="660" width="26" height="16" rx="4"/></g>
<text class="note" x="74" y="672">check</text>
<g class="node disp"><rect x="121" y="660" width="26" height="16" rx="4"/></g>
<text class="note" x="155" y="672">line the dispatcher handles</text>
<g class="node quiet"><rect x="356" y="660" width="26" height="16" rx="4"/></g>
<text class="note" x="390" y="672">line without a model</text>
<path class="e e-flow" d="M 542 668 L 568 668" marker-end="url(#a-flow)"/>
<text class="note" x="576" y="672">moves on</text>
