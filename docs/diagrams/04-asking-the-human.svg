<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="640" viewBox="0 0 2100 640" font-family="Helvetica, Arial, sans-serif">
<title>04 · Asking the human</title>
<style>
.bg { fill: #ffffff; }
.title { font: 600 22px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.subtitle { font: 14px Helvetica, Arial, sans-serif; fill: #5b606b; }
.node rect, .node polygon { stroke-width: 1.6; }
