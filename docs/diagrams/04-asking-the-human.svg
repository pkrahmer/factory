.human rect, .human polygon, .human circle { fill: #fff3dc; stroke: #c27400; }
.human .s { fill: #a86400; }
.disp rect, .disp polygon, .disp circle { fill: #f0f1f3; stroke: #6b6f7a; }
.disp .s { fill: #5b606b; }
.ask rect, .ask polygon, .ask circle { fill: #f3edfb; stroke: #7a4fb5; }
.ask .s { fill: #7a4fb5; }
.stall rect, .stall polygon, .stall circle { fill: #fcebeb; stroke: #b53a3a; }
.stall .s { fill: #b53a3a; }
.back rect, .back polygon, .back circle { fill: #fdf0e6; stroke: #d0661a; }
.back .s { fill: #b5560f; }
.end rect { fill: #ffffff; stroke: #8a8f99; stroke-dasharray: 5 3; }
.code rect, .code polygon, .code circle { fill: #e8f5f0; stroke: #2a8a6e; }
.code .s { fill: #22775e; }
.quiet rect { fill: #f7f8fa; stroke: #a3a8b2; } .quiet .s { fill: #6b6f7a; }
.lane { fill: #f7f8fa; stroke: #dfe2e7; }
.lane-alt { fill: #ffffff; stroke: #dfe2e7; }
.lane-head { font: 700 13.5px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.lane-note { font: 12px Helvetica, Arial, sans-serif; fill: #5b606b; }
.e { fill: none; stroke-width: 1.8; }
.e-flow { stroke: #3a3d44; }
.e-back { stroke: #d0661a; }
.e-ask { stroke: #7a4fb5; stroke-dasharray: 6 4; }
.e-stall { stroke: #b53a3a; stroke-dasharray: 6 4; }
.lbl { font: 12px Helvetica, Arial, sans-serif; paint-order: stroke; stroke: #ffffff;
       stroke-width: 5px; stroke-linejoin: round; }
.lbl-flow { fill: #1d1f24; } .lbl-back { fill: #a84f0e; }
.lbl-ask { fill: #6a3fa5; } .lbl-stall { fill: #a32f2f; }
.note { font: 12.5px Helvetica, Arial, sans-serif; fill: #4a4e57; }
.note-b { font: 700 12.5px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.mono { font-family: Menlo, Consolas, monospace; }
.trunk { stroke: #3a3d44; } .twig { stroke: #8a8f99; }
.pr-draft { fill: #f7f8fa; stroke: #a3a8b2; } .pr-ready { fill: #fff3dc; stroke: #c27400; }
.band-main { fill: #e7e9ed; } .band-ticket { fill: #dbe8f7; }
.m-flow { fill: #3a3d44; } .m-back { fill: #d0661a; } .m-ask { fill: #7a4fb5; }
.m-stall { fill: #b53a3a; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0f141a; }
  .title, .node .t, .lane-head, .note-b { fill: #e6edf3; }
  .subtitle, .lane-note { fill: #9da7b3; }
  .node .l, .note { fill: #c9d1d9; }
  .agent rect, .agent polygon, .agent circle { fill: #132a45; stroke: #5b9be6; }
  .agent .s { fill: #7fb2f0; }
  .human rect, .human polygon, .human circle { fill: #3a2a0e; stroke: #e0a33a; }
  .human .s { fill: #f0b85a; }
  .disp rect, .disp polygon, .disp circle { fill: #23282f; stroke: #8b939e; }
  .disp .s { fill: #a8b0bb; }
  .ask rect, .ask polygon, .ask circle { fill: #2a1f40; stroke: #a98be0; }
  .ask .s { fill: #c0a8f0; }
  .stall rect, .stall polygon, .stall circle { fill: #3d1a1c; stroke: #e06c6c; }
  .stall .s { fill: #f08a8a; }
  .back rect, .back polygon, .back circle { fill: #3d2414; stroke: #ef8a3c; }
  .back .s { fill: #f5a466; }
  .code rect, .code polygon, .code circle { fill: #10322a; stroke: #3fb68f; }
  .code .s { fill: #6fd0ad; }
  .quiet rect { fill: #181e26; stroke: #6b7380; } .quiet .s { fill: #9da7b3; }
  .end rect { fill: #0f141a; stroke: #8b939e; }
  .lane { fill: #151b23; stroke: #2a313b; } .lane-alt { fill: #0f141a; stroke: #2a313b; }
  .e-flow { stroke: #c9d1d9; } .e-back { stroke: #ef8a3c; }
  .e-ask { stroke: #a98be0; } .e-stall { stroke: #e06c6c; }
  .m-flow { fill: #c9d1d9; } .m-back { fill: #ef8a3c; } .m-ask { fill: #a98be0; }
  .m-stall { fill: #e06c6c; }
  .lbl { stroke: #0f141a; }
  .lbl-flow { fill: #e6edf3; } .lbl-back { fill: #f5a466; }
  .lbl-ask { fill: #c0a8f0; } .lbl-stall { fill: #f08a8a; }
  .trunk { stroke: #c9d1d9; } .twig { stroke: #6b7380; }
  .pr-draft { fill: #181e26; stroke: #6b7380; } .pr-ready { fill: #3a2a0e; stroke: #e0a33a; }
  .band-main { fill: #23282f; } .band-ticket { fill: #132a45; }
}
</style><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-flow" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-back" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-ask" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-ask" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-stall" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-stall" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="2100" height="640"/>
<text class="title" x="40" y="46">04 · Asking the human</text>
<text class="subtitle" x="40" y="70">Questions travel only through the pull request; the answer comes back into the story log, so the next run of the stage can read it.</text>
<g class="node agent"><rect x="40" y="604" width="26" height="16" rx="4"/></g>
<text class="note" x="74" y="616">agent</text>
<g class="node code"><rect x="121" y="604" width="26" height="16" rx="4"/></g>
<text class="note" x="155" y="616">the factory (code)</text>
<g class="node human"><rect x="293" y="604" width="26" height="16" rx="4"/></g>
<text class="note" x="327" y="616">human</text>
<path class="e e-ask" d="M 374 612 L 400 612" marker-end="url(#a-ask)"/>
<text class="note" x="408" y="616">question and answer</text>
<path class="e e-stall" d="M 553 612 L 579 612" marker-end="url(#a-stall)"/>
<text class="note" x="587" y="616">stalls, discards</text>
<path class="e e-ask" d="M 280 182 L 310 182 Q 320 182 320 192 L 320 216 Q 320 226 330 226 L 380 226" marker-end="url(#a-ask)"/>
<path class="e e-back" d="M 280 268 L 313 268 Q 320 268 320 261 L 320 261 Q 320 254 327 254 L 380 254" marker-end="url(#a-back)"/>
<path class="e e-stall" d="M 280 412 L 680 412" marker-end="url(#a-stall)"/>
<path class="e e-back" d="M 280 498 L 680 498" marker-end="url(#a-back)"/>
<path class="e e-ask" d="M 580 240 L 680 240" marker-end="url(#a-ask)"/>
<path class="e e-ask" d="M 900 300 L 1000 300" marker-end="url(#a-ask)"/>
<path class="e e-ask" d="M 1190 206 L 1320 206" marker-end="url(#a-ask)"/>
<path class="e e-stall" d="M 1190 366 L 1320 366" marker-end="url(#a-stall)"/>
<path class="e e-flow" d="M 1190 506 L 1320 506" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1540 206 L 1650 206" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1860 206 L 1950 206" marker-end="url(#a-flow)"/>
<path class="e e-stall" d="M 1540 366 L 1650 366" marker-end="url(#a-stall)"/>
<path class="e e-flow" d="M 1540 506 L 1650 506" marker-end="url(#a-flow)"/>
<path class="e e-ask" d="M 1755 150 L 1755 126 Q 1755 116 1745 116 L 490 116 Q 480 116 480 126 L 480 180" marker-end="url(#a-ask)"/>
<g class="node agent"><rect x="40" y="150" width="240" height="64" rx="32"/><text class="l" x="160" y="180.5" text-anchor="middle">an agent ends with</text><text class="l" x="160" y="196.5" text-anchor="middle">question (R8)</text></g>
<g class="node back"><rect x="40" y="236" width="240" height="64" rx="32"/><text class="l" x="160" y="266.5" text-anchor="middle">rework cap: round over</text><text class="l" x="160" y="282.5" text-anchor="middle">max_rounds</text></g>
<g class="node stall"><rect x="40" y="380" width="240" height="64" rx="32"/><text class="l" x="160" y="410.5" text-anchor="middle">stalled too often:</text><text class="l" x="160" y="426.5" text-anchor="middle">attempts at max</text></g>
<g class="node human"><rect x="40" y="466" width="240" height="64" rx="32"/><text class="l" x="160" y="496.5" text-anchor="middle">PR closed at accept</text><text class="l" x="160" y="512.5" text-anchor="middle">without a comment</text></g>
<g class="node ask"><rect x="380" y="180" width="200" height="120" rx="10"/><text class="t" x="480" y="210.5" text-anchor="middle">question</text><text class="s" x="480" y="227.5" text-anchor="middle">FACTORY</text><text class="l" x="480" y="248.5" text-anchor="middle">the entry in the log,</text><text class="l" x="480" y="264.5" text-anchor="middle">blocked: question,</text><text class="l" x="480" y="280.5" text-anchor="middle">commit, push</text></g>
<g class="node code"><rect x="680" y="180" width="220" height="370" rx="10"/><text class="t" x="790" y="327.5" text-anchor="middle">post</text><text class="s" x="790" y="344.5" text-anchor="middle">FACTORY</text><text class="l" x="790" y="365.5" text-anchor="middle">the question on</text><text class="l" x="790" y="381.5" text-anchor="middle">the PR, verbatim;</text><text class="l" x="790" y="397.5" text-anchor="middle">blocked: asked,</text><text class="l" x="790" y="413.5" text-anchor="middle">comments_seen = n</text></g>
<g class="node human"><rect x="1000" y="180" width="190" height="370" rx="10"/><text class="t" x="1095" y="343.5" text-anchor="middle">the human</text><text class="s" x="1095" y="360.5" text-anchor="middle">HUMAN</text><text class="l" x="1095" y="381.5" text-anchor="middle">reads the PR,</text><text class="l" x="1095" y="397.5" text-anchor="middle">wherever they are</text></g>
<g class="node code"><rect x="1320" y="150" width="220" height="112" rx="10"/><text class="t" x="1430" y="176.5" text-anchor="middle">copy back</text><text class="s" x="1430" y="193.5" text-anchor="middle">FACTORY</text><text class="l" x="1430" y="214.5" text-anchor="middle">new comments into the</text><text class="l" x="1430" y="230.5" text-anchor="middle">log, blocked: null;</text><text class="l" x="1430" y="246.5" text-anchor="middle">at the cap: attempts 0</text></g>
<g class="node agent"><rect x="1650" y="150" width="210" height="112" rx="10"/><text class="t" x="1755" y="184.5" text-anchor="middle">same stage</text><text class="s" x="1755" y="201.5" text-anchor="middle">AGENT</text><text class="l" x="1755" y="222.5" text-anchor="middle">runs again and reads</text><text class="l" x="1755" y="238.5" text-anchor="middle">the answer in the log</text></g>
<g class="node code"><rect x="1320" y="316" width="220" height="100" rx="10"/><text class="t" x="1430" y="336.5" text-anchor="middle">discard</text><text class="s" x="1430" y="353.5" text-anchor="middle">FACTORY</text><text class="l" x="1430" y="374.5" text-anchor="middle">on main: story back</text><text class="l" x="1430" y="390.5" text-anchor="middle">to drafts/; branch</text><text class="l" x="1430" y="406.5" text-anchor="middle">deleted</text></g>
<g class="node code"><rect x="1320" y="456" width="220" height="100" rx="10"/><text class="t" x="1430" y="484.5" text-anchor="middle">archive</text><text class="s" x="1430" y="501.5" text-anchor="middle">FACTORY</text><text class="l" x="1430" y="522.5" text-anchor="middle">as merged: story</text><text class="l" x="1430" y="538.5" text-anchor="middle">to done/ (01)</text></g>
<g class="node end"><rect x="1950" y="180" width="120" height="52" rx="26"/><text class="t" x="2010" y="211.5" text-anchor="middle">moves on</text></g>
<g class="node end"><rect x="1650" y="340" width="210" height="52" rx="26"/><text class="t" x="1755" y="371.5" text-anchor="middle">the human&#x27;s draft</text></g>
<g class="node end"><rect x="1650" y="480" width="210" height="52" rx="26"/><text class="t" x="1755" y="511.5" text-anchor="middle">done</text></g>


<text class="lbl lbl-stall" text-anchor="middle"><tspan x="480" y="403">last stall reason</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="480" y="474">reopened as draft;</tspan><tspan x="480" y="489">stage: doing</tspan></text>
<text class="lbl lbl-ask" text-anchor="middle"><tspan x="630" y="216">watcher:</tspan><tspan x="630" y="231">ask</tspan></text>
<text class="lbl lbl-ask" text-anchor="middle"><tspan x="950" y="276">watcher: pr</tspan><tspan x="950" y="291">OPEN n</tspan></text>
<text class="lbl lbl-ask" text-anchor="middle"><tspan x="1255" y="182">comments</tspan><tspan x="1255" y="197">on the PR</tspan></text>
<text class="lbl lbl-stall" text-anchor="middle"><tspan x="1255" y="342">closes</tspan><tspan x="1255" y="357">the PR</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1255" y="482">marks ready,</tspan><tspan x="1255" y="497">merges</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1595" y="182">next</tspan><tspan x="1595" y="197">tick</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1905" y="197">answered</tspan></text>
<text class="lbl lbl-stall" text-anchor="middle"><tspan x="1595" y="357">commit</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1595" y="497">commit</tspan></text>
<text class="lbl lbl-ask" text-anchor="middle"><tspan x="1117.5" y="108">still unclear: asks again</tspan></text>
</svg>
