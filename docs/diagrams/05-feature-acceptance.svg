<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="580" viewBox="0 0 2160 580" font-family="Helvetica, Arial, sans-serif">
<title>05 · Feature acceptance</title>
<style>
.bg { fill: #ffffff; }
.title { font: 600 22px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.subtitle { font: 14px Helvetica, Arial, sans-serif; fill: #5b606b; }
.node rect, .node polygon { stroke-width: 1.6; }
.node .t { font: 700 15px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.node .s { font: 600 11px Helvetica, Arial, sans-serif; letter-spacing: 0.06em; }
.node .l { font: 12.5px Helvetica, Arial, sans-serif; fill: #30333a; }
.agent rect, .agent polygon, .agent circle { fill: #eaf2fb; stroke: #2f6db5; }
.agent .s { fill: #2f6db5; }
.human rect, .human polygon, .human circle { fill: #fff3dc; stroke: #c27400; }
.human .s { fill: #a86400; }
.disp rect, .disp polygon, .disp circle { fill: #f0f1f3; stroke: #6b6f7a; }
.disp .s { fill: #5b606b; }
.ask rect, .ask polygon, .ask circle { fill: #f3edfb; stroke: #7a4fb5; }
.ask .s { fill: #7a4fb5; }
.stall rect, .stall polygon, .stall circle { fill: #fcebeb; stroke: #b53a3a; }
.stall .s { fill: #b53a3a; }
.back rect, .back polygon, .back circle { fill: #fdf0e6; stroke: #d0661a; }
.back .s { fill: #b5560f; }
.end rect { fill: #ffffff; stroke: #8a8f99; stroke-dasharray: 5 3; }
.code rect, .code polygon, .code circle { fill: #e8f5f0; stroke: #2a8a6e; }
.code .s { fill: #22775e; }
.quiet rect { fill: #f7f8fa; stroke: #a3a8b2; } .quiet .s { fill: #6b6f7a; }
.lane { fill: #f7f8fa; stroke: #dfe2e7; }
.lane-alt { fill: #ffffff; stroke: #dfe2e7; }
.lane-head { font: 700 13.5px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.lane-note { font: 12px Helvetica, Arial, sans-serif; fill: #5b606b; }
.e { fill: none; stroke-width: 1.8; }
.e-flow { stroke: #3a3d44; }
.e-back { stroke: #d0661a; }
.e-ask { stroke: #7a4fb5; stroke-dasharray: 6 4; }
.e-stall { stroke: #b53a3a; stroke-dasharray: 6 4; }
.lbl { font: 12px Helvetica, Arial, sans-serif; paint-order: stroke; stroke: #ffffff;
       stroke-width: 5px; stroke-linejoin: round; }
.lbl-flow { fill: #1d1f24; } .lbl-back { fill: #a84f0e; }
.lbl-ask { fill: #6a3fa5; } .lbl-stall { fill: #a32f2f; }
.note { font: 12.5px Helvetica, Arial, sans-serif; fill: #4a4e57; }
.note-b { font: 700 12.5px Helvetica, Arial, sans-serif; fill: #1d1f24; }
.mono { font-family: Menlo, Consolas, monospace; }
.trunk { stroke: #3a3d44; } .twig { stroke: #8a8f99; }
.pr-draft { fill: #f7f8fa; stroke: #a3a8b2; } .pr-ready { fill: #fff3dc; stroke: #c27400; }
.band-main { fill: #e7e9ed; } .band-ticket { fill: #dbe8f7; }
.m-flow { fill: #3a3d44; } .m-back { fill: #d0661a; } .m-ask { fill: #7a4fb5; }
.m-stall { fill: #b53a3a; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0f141a; }
  .title, .node .t, .lane-head, .note-b { fill: #e6edf3; }
  .subtitle, .lane-note { fill: #9da7b3; }
  .node .l, .note { fill: #c9d1d9; }
  .agent rect, .agent polygon, .agent circle { fill: #132a45; stroke: #5b9be6; }
  .agent .s { fill: #7fb2f0; }
  .human rect, .human polygon, .human circle { fill: #3a2a0e; stroke: #e0a33a; }
  .human .s { fill: #f0b85a; }
  .disp rect, .disp polygon, .disp circle { fill: #23282f; stroke: #8b939e; }
  .disp .s { fill: #a8b0bb; }
  .ask rect, .ask polygon, .ask circle { fill: #2a1f40; stroke: #a98be0; }
  .ask .s { fill: #c0a8f0; }
  .stall rect, .stall polygon, .stall circle { fill: #3d1a1c; stroke: #e06c6c; }
  .stall .s { fill: #f08a8a; }
  .back rect, .back polygon, .back circle { fill: #3d2414; stroke: #ef8a3c; }
  .back .s { fill: #f5a466; }
  .code rect, .code polygon, .code circle { fill: #10322a; stroke: #3fb68f; }
  .code .s { fill: #6fd0ad; }
  .quiet rect { fill: #181e26; stroke: #6b7380; } .quiet .s { fill: #9da7b3; }
  .end rect { fill: #0f141a; stroke: #8b939e; }
  .lane { fill: #151b23; stroke: #2a313b; } .lane-alt { fill: #0f141a; stroke: #2a313b; }
  .e-flow { stroke: #c9d1d9; } .e-back { stroke: #ef8a3c; }
  .e-ask { stroke: #a98be0; } .e-stall { stroke: #e06c6c; }
  .m-flow { fill: #c9d1d9; } .m-back { fill: #ef8a3c; } .m-ask { fill: #a98be0; }
  .m-stall { fill: #e06c6c; }
  .lbl { stroke: #0f141a; }
  .lbl-flow { fill: #e6edf3; } .lbl-back { fill: #f5a466; }
  .lbl-ask { fill: #c0a8f0; } .lbl-stall { fill: #f08a8a; }
  .trunk { stroke: #c9d1d9; } .twig { stroke: #6b7380; }
  .pr-draft { fill: #181e26; stroke: #6b7380; } .pr-ready { fill: #3a2a0e; stroke: #e0a33a; }
  .band-main { fill: #23282f; } .band-ticket { fill: #132a45; }
}
</style><defs><marker id="a-flow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-flow" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-back" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-back" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-ask" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-ask" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a-stall" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-stall" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="2160" height="580"/>
<text class="title" x="40" y="46">05 · Feature acceptance</text>
<text class="subtitle" x="40" y="70">Once per feature, after its last story is archived: the acceptor judges the whole against FEATURE.md and proposes stories; the human decides by merging or closing.</text>
<g class="node agent"><rect x="40" y="548" width="26" height="16" rx="4"/></g>
<text class="note" x="74" y="560">agent</text>
<g class="node human"><rect x="121" y="548" width="26" height="16" rx="4"/></g>
<text class="note" x="155" y="560">human</text>
<g class="node disp"><rect x="202" y="548" width="26" height="16" rx="4"/></g>
<text class="note" x="236" y="560">dispatcher</text>
<g class="node quiet"><rect x="318" y="548" width="26" height="16" rx="4"/></g>
<text class="note" x="352" y="560">nothing happens</text>
<path class="e e-flow" d="M 469 556 L 495 556" marker-end="url(#a-flow)"/>
<text class="note" x="503" y="560">moves on</text>
<path class="e e-back" d="M 571 556 L 597 556" marker-end="url(#a-back)"/>
<text class="note" x="605" y="560">loops</text>
<path class="e e-flow" d="M 20 234 L 110 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 250 234 L 330 234" marker-end="url(#a-flow)"/>
<path class="e e-stall" d="M 180 289 L 180 404" marker-end="url(#a-stall)"/>
<path class="e e-flow" d="M 520 234 L 600 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 790 234 L 870 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1060 234 L 1160 234" marker-end="url(#a-flow)"/>
<path class="e e-flow" d="M 1350 200 L 1470 200" marker-end="url(#a-flow)"/>
<path class="e e-stall" d="M 1350 390 L 1470 390" marker-end="url(#a-stall)"/>
<path class="e e-flow" d="M 1700 200 L 1740 200 Q 1750 200 1750 210 L 1750 292 Q 1750 302 1760 302 L 1800 302" marker-end="url(#a-flow)"/>
<path class="e e-stall" d="M 1700 390 L 1740 390 Q 1750 390 1750 380 L 1750 312 Q 1750 302 1760 302 L 1800 302" marker-end="url(#a-stall)"/>
<path class="e e-back" d="M 1905 256 L 1905 126 Q 1905 116 1895 116 L 190 116 Q 180 116 180 126 L 180 179" marker-end="url(#a-back)"/>
<g class="node code"><polygon points="180.0,179.0 250,234.0 180.0,289.0 110,234.0"/><text class="l" x="180" y="232.5" text-anchor="middle">acceptance</text><text class="l" x="180" y="248.5" text-anchor="middle">due?</text></g>
<g class="node quiet"><rect x="85" y="404" width="190" height="72" rx="10"/><text class="t" x="180" y="435" text-anchor="middle">nothing to do</text><text class="l" x="180" y="456" text-anchor="middle">for this feature</text></g>
<g class="node agent"><rect x="330" y="170" width="190" height="128" rx="10"/><text class="t" x="425" y="196.5" text-anchor="middle">branch and claim</text><text class="s" x="425" y="213.5" text-anchor="middle">ACCEPTOR</text><text class="l" x="425" y="234.5" text-anchor="middle">acceptance/&lt;feature&gt;</text><text class="l" x="425" y="250.5" text-anchor="middle">from main; report with</text><text class="l" x="425" y="266.5" text-anchor="middle">stories: [ids];</text><text class="l" x="425" y="282.5" text-anchor="middle">draft PR</text></g>
<g class="node agent"><rect x="600" y="170" width="190" height="128" rx="10"/><text class="t" x="695" y="196.5" text-anchor="middle">eight checks</text><text class="s" x="695" y="213.5" text-anchor="middle">ACCEPTOR</text><text class="l" x="695" y="234.5" text-anchor="middle">scope, feature demo,</text><text class="l" x="695" y="250.5" text-anchor="middle">make mutants, noticed</text><text class="l" x="695" y="266.5" text-anchor="middle">items, docs, decisions,</text><text class="l" x="695" y="282.5" text-anchor="middle">slow checks, cost</text></g>
<g class="node agent"><rect x="870" y="170" width="190" height="128" rx="10"/><text class="t" x="965" y="204.5" text-anchor="middle">report and drafts</text><text class="s" x="965" y="221.5" text-anchor="middle">ACCEPTOR</text><text class="l" x="965" y="242.5" text-anchor="middle">verdict and eight</text><text class="l" x="965" y="258.5" text-anchor="middle">sections; proposed</text><text class="l" x="965" y="274.5" text-anchor="middle">stories into drafts/</text></g>
<g class="node human"><rect x="1160" y="170" width="190" height="270" rx="10"/><text class="t" x="1255" y="283.5" text-anchor="middle">accept</text><text class="s" x="1255" y="300.5" text-anchor="middle">HUMAN</text><text class="l" x="1255" y="321.5" text-anchor="middle">reads the report</text><text class="l" x="1255" y="337.5" text-anchor="middle">and the drafts</text></g>
<g class="node disp"><rect x="1470" y="136" width="230" height="128" rx="10"/><text class="t" x="1585" y="162.5" text-anchor="middle">accepted</text><text class="s" x="1585" y="179.5" text-anchor="middle">DISPATCHER</text><text class="l" x="1585" y="200.5" text-anchor="middle">on main: stage done,</text><text class="l" x="1585" y="216.5" text-anchor="middle">outcome: accepted;</text><text class="l" x="1585" y="232.5" text-anchor="middle">report and drafts stay,</text><text class="l" x="1585" y="248.5" text-anchor="middle">branch deleted</text></g>
<g class="node disp"><rect x="1470" y="326" width="230" height="128" rx="10"/><text class="t" x="1585" y="352.5" text-anchor="middle">refused</text><text class="s" x="1585" y="369.5" text-anchor="middle">DISPATCHER</text><text class="l" x="1585" y="390.5" text-anchor="middle">on main: the report,</text><text class="l" x="1585" y="406.5" text-anchor="middle">outcome: refused, your</text><text class="l" x="1585" y="422.5" text-anchor="middle">comment under the verdict;</text><text class="l" x="1585" y="438.5" text-anchor="middle">drafts dropped</text></g>
<g class="node quiet"><rect x="1800" y="256" width="210" height="92" rx="10"/><text class="t" x="1905" y="281" text-anchor="middle">feature status</text><text class="l" x="1905" y="302" text-anchor="middle">accepted or refused,</text><text class="l" x="1905" y="318" text-anchor="middle">until another story</text><text class="l" x="1905" y="334" text-anchor="middle">is archived</text></g>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="65" y="209">watcher:</tspan><tspan x="65" y="224">a tick</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="290" y="225">yes</tspan></text>
<text class="lbl lbl-stall" text-anchor="start"><tspan x="189" y="350.5">no</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="560" y="210">claim</tspan><tspan x="560" y="225">pushed</tspan></text>

<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1110" y="210">PR ready;</tspan><tspan x="1110" y="225">stage: accept</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1410" y="191">merges</tspan></text>
<text class="lbl lbl-stall" text-anchor="middle"><tspan x="1410" y="366">closes, with a</tspan><tspan x="1410" y="381">comment: why</tspan></text>


<text class="lbl lbl-back" text-anchor="middle"><tspan x="1042.5" y="108">another story archived: the report no longer covers the feature, due again</tspan></text>
</svg>
