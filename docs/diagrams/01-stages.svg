<path class="e e-stall" d="M 296 540 L 120 540 Q 110 540 110 530 L 110 292" marker-end="url(#a-stall)"/>
<g class="node human"><rect x="40" y="160" width="140" height="132" rx="10"/><text class="t" x="110" y="188.5" text-anchor="middle">drafts/</text><text class="s" x="110" y="205.5" text-anchor="middle">HUMAN</text><text class="l" x="110" y="226.5" text-anchor="middle">Story written</text><text class="l" x="110" y="242.5" text-anchor="middle">from TICKET.md;</text><text class="l" x="110" y="258.5" text-anchor="middle">the pipeline</text><text class="l" x="110" y="274.5" text-anchor="middle">ignores it</text></g>
<g class="node agent"><rect x="296" y="160" width="176" height="132" rx="10"/><text class="t" x="384" y="188.5" text-anchor="middle">ready</text><text class="s" x="384" y="205.5" text-anchor="middle">INTAKE</text><text class="l" x="384" y="226.5" text-anchor="middle">Opens the branch</text><text class="l" x="384" y="242.5" text-anchor="middle">and a draft PR;</text><text class="l" x="384" y="258.5" text-anchor="middle">checks the story</text><text class="l" x="384" y="274.5" text-anchor="middle">is buildable</text></g>
<g class="node agent"><rect x="588" y="160" width="176" height="132" rx="10"/><text class="t" x="676" y="188.5" text-anchor="middle">tests</text><text class="s" x="676" y="205.5" text-anchor="middle">TESTER</text><text class="l" x="676" y="226.5" text-anchor="middle">One test per</text><text class="l" x="676" y="242.5" text-anchor="middle">acceptance</text><text class="l" x="676" y="258.5" text-anchor="middle">criterion, red</text><text class="l" x="676" y="274.5" text-anchor="middle">on purpose</text></g>
<g class="node agent"><rect x="880" y="160" width="176" height="132" rx="10"/><text class="t" x="968" y="188.5" text-anchor="middle">doing</text><text class="s" x="968" y="205.5" text-anchor="middle">CODER</text><text class="l" x="968" y="226.5" text-anchor="middle">Makes the tests</text><text class="l" x="968" y="242.5" text-anchor="middle">pass, refactors</text><text class="l" x="968" y="258.5" text-anchor="middle">once, make check</text><text class="l" x="968" y="274.5" text-anchor="middle">green</text></g>
<g class="node agent"><rect x="1172" y="160" width="176" height="132" rx="10"/><text class="t" x="1260" y="188.5" text-anchor="middle">review</text><text class="s" x="1260" y="205.5" text-anchor="middle">REVIEWER</text><text class="l" x="1260" y="226.5" text-anchor="middle">Reads the diff</text><text class="l" x="1260" y="242.5" text-anchor="middle">against criteria,</text><text class="l" x="1260" y="258.5" text-anchor="middle">architecture and</text><text class="l" x="1260" y="274.5" text-anchor="middle">security</text></g>
<g class="node agent"><rect x="1464" y="160" width="176" height="132" rx="10"/><text class="t" x="1552" y="188.5" text-anchor="middle">docs</text><text class="s" x="1552" y="205.5" text-anchor="middle">DOCUMENTER</text><text class="l" x="1552" y="226.5" text-anchor="middle">Writes what the</text><text class="l" x="1552" y="242.5" text-anchor="middle">reader needs into</text><text class="l" x="1552" y="258.5" text-anchor="middle">README and docs/;</text><text class="l" x="1552" y="274.5" text-anchor="middle">fixes stale prose</text></g>
<g class="node agent"><rect x="1756" y="160" width="176" height="132" rx="10"/><text class="t" x="1844" y="188.5" text-anchor="middle">demo</text><text class="s" x="1844" y="205.5" text-anchor="middle">DEMO</text><text class="l" x="1844" y="226.5" text-anchor="middle">Runs the demo</text><text class="l" x="1844" y="242.5" text-anchor="middle">commands, judges</text><text class="l" x="1844" y="258.5" text-anchor="middle">the output, writes</text><text class="l" x="1844" y="274.5" text-anchor="middle">the PR body</text></g>
<g class="node human"><rect x="2048" y="160" width="176" height="132" rx="10"/><text class="t" x="2136" y="188.5" text-anchor="middle">accept</text><text class="s" x="2136" y="205.5" text-anchor="middle">HUMAN</text><text class="l" x="2136" y="226.5" text-anchor="middle">Reads the PR,</text><text class="l" x="2136" y="242.5" text-anchor="middle">wherever they are;</text><text class="l" x="2136" y="258.5" text-anchor="middle">then merges or</text><text class="l" x="2136" y="274.5" text-anchor="middle">closes it</text></g>
<g class="node disp"><rect x="2340" y="160" width="150" height="132" rx="10"/><text class="t" x="2415" y="188.5" text-anchor="middle">done</text><text class="s" x="2415" y="205.5" text-anchor="middle">DISPATCHER</text><text class="l" x="2415" y="226.5" text-anchor="middle">Story moved to</text><text class="l" x="2415" y="242.5" text-anchor="middle">done/ on main,</text><text class="l" x="2415" y="258.5" text-anchor="middle">branch deleted,</text><text class="l" x="2415" y="274.5" text-anchor="middle">cost logged</text></g>
<g class="node agent"><rect x="2320" y="372" width="190" height="64" rx="10"/><text class="t" x="2415" y="399" text-anchor="middle">feature acceptance</text><text class="l" x="2415" y="420" text-anchor="middle">acceptor, see 05</text></g>
<text class="lbl lbl-flow" text-anchor="start"><tspan x="2424" y="321">the feature&#x27;s</tspan><tspan x="2424" y="336">last story</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="238" y="202">human moves it</tspan><tspan x="238" y="217">into ongoing/</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="530" y="202">story is</tspan><tspan x="530" y="217">complete</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="822" y="202">tests</tspan><tspan x="822" y="217">committed</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1114" y="202">make check</tspan><tspan x="1114" y="217">green</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1406" y="202">verdict:</tspan><tspan x="1406" y="217">pass</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1698" y="202">docs written,</tspan><tspan x="1698" y="217">no findings</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="1990" y="202">all as expected,</tspan><tspan x="1990" y="217">PR marked ready</tspan></text>
<text class="lbl lbl-flow" text-anchor="middle"><tspan x="2282" y="202">human merges</tspan><tspan x="2282" y="217">the PR</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="1158" y="351">verdict: rework · round + 1</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="1304" y="395">docs and code disagree · round + 1</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="1450" y="439">output differs from Expect · round + 1</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="1596" y="483">human closes the PR · round + 1</tspan></text>
<text class="lbl lbl-back" text-anchor="middle"><tspan x="822" y="106">human approved a test change</tspan></text>
<text class="lbl lbl-stall" text-anchor="middle"><tspan x="1114" y="532">human closes the PR while ready … demo work on it: story discarded, branch deleted</tspan></text>
</svg>
