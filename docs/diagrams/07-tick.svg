<g class="node code"><rect x="1640" y="140" width="220" height="136" rx="10"/><text class="t" x="1750" y="162.5" text-anchor="middle">needs a model?</text><text class="s" x="1750" y="179.5" text-anchor="middle">TICK</text><text class="l" x="1750" y="200.5" text-anchor="middle">not for idle or busy, nor</text><text class="l" x="1750" y="216.5" text-anchor="middle">pr whose new comments</text><text class="l" x="1750" y="232.5" text-anchor="middle">are all the tick&#x27;s own,</text><text class="l" x="1750" y="248.5" text-anchor="middle">nor a line already</text><text class="l" x="1750" y="264.5" text-anchor="middle">handled at this HEAD</text></g>
