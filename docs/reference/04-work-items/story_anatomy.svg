<rect class="bg" width="848" height="936"/>
<text class="ttl" x="40" y="48" text-anchor="start">The anatomy of a story file</text>
<text class="sub" x="40" y="72" text-anchor="start">Every part has one owner; agents write only inside the specification, and only in narrow cases.</text>
<rect class="grp g-store" x="40" y="104" width="360" height="760" rx="12"/><text class="grp-c k-store" x="54" y="125" text-anchor="start"><tspan class="code">ONGOING/F0002-S0001-health-endpoint.md</tspan></text>
