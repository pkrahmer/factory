<g class="n-human"><rect class="sh" x="56" y="384" width="328" height="64" rx="8"/><text class="nt" x="68" y="410.43" text-anchor="start"><tspan class="code">## Assignment (as of log entry 1)</tspan></text><text class="nb" x="68" y="432.25" text-anchor="start">the current meaning</text></g>
<g class="n-human"><rect class="sh" x="56" y="456" width="328" height="64" rx="8"/><text class="nt" x="68" y="482.43" text-anchor="start"><tspan class="code">## Interface</tspan></text><text class="nb" x="68" y="504.25" text-anchor="start">modules, signatures, errors</text></g>
<g class="n-human"><rect class="sh" x="56" y="528" width="328" height="64" rx="8"/><text class="nt" x="68" y="554.43" text-anchor="start"><tspan class="code">## Acceptance criteria</tspan></text><text class="nb" x="68" y="576.25" text-anchor="start">numbered; last two fixed: <tspan class="code">make check</tspan> · <tspan class="code">docs:</tspan></text></g>
