<g class="n-human"><rect class="sh" x="173.46" y="877.5" width="26" height="13" rx="3"/></g><text class="lg" x="207.46" y="888" text-anchor="start">the human's</text>
<g class="n-code"><rect class="sh" x="303.05" y="877.5" width="26" height="13" rx="3"/></g><text class="lg" x="337.05" y="888" text-anchor="start">the factory's</text>
