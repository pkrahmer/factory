<svg xmlns="http://www.w3.org/2000/svg" width="848" height="936" viewBox="0 0 848 936" role="img" aria-labelledby="title desc">
<title id="title">The anatomy of a story file</title>
<desc id="desc">A story file in production, drawn as one tall document with the writers on its right. From top to bottom: the frontmatter, which belongs to the factory; the specification, which belongs to the human, with the title, the assignment, the interface, the acceptance criteria and the demo; and the append-only log. The factory is the only writer of the frontmatter and appends every entry to the log. The human writes the draft of the specification and speaks in the log through pull request comments, which the factory copies. Stage agents rewrite the assignment when a log entry changes the meaning, and intake carries an answer into the acceptance criteria. The text of their log entries reaches the log through the outcome.</desc>
<style>
