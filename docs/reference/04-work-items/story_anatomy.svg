<g class="n-code"><rect class="sh" x="56" y="720" width="328" height="112" rx="8"/><text class="nt" x="68" y="744.93" text-anchor="start"><tspan class="code">## Log (append only)</tspan></text><text class="nb" x="68" y="766.75" text-anchor="start"><tspan class="code">1. … human: created.</tspan></text><text class="nb" x="68" y="783.75" text-anchor="start"><tspan class="code">2. intake: …</tspan></text><text class="nb" x="68" y="800.75" text-anchor="start"><tspan class="code">3. human (pull request comment, …): …</tspan></text><text class="nb" x="68" y="817.75" text-anchor="start"><tspan class="code">… done (pull request merged); cost: …</tspan></text></g>
<g class="n-code"><rect class="sh" x="560" y="160" width="200" height="112" rx="8"/><text class="tag" x="660" y="182.07" text-anchor="middle">CODE</text><text class="nt" x="660" y="200.93" text-anchor="middle">The factory</text><text class="nb" x="660" y="222.75" text-anchor="middle">writes state and log;</text><text class="nb" x="660" y="239.75" text-anchor="middle">restores both after</text><text class="nb" x="660" y="256.75" text-anchor="middle">every agent run</text></g>
<g class="n-human"><rect class="sh" x="560" y="288" width="200" height="112" rx="8"/><text class="tag" x="660" y="310.07" text-anchor="middle">HUMAN</text><text class="nt" x="660" y="328.93" text-anchor="middle">The human</text><text class="nb" x="660" y="350.75" text-anchor="middle">writes the draft; speaks</text><text class="nb" x="660" y="367.75" text-anchor="middle">in the log through pull</text><text class="nb" x="660" y="384.75" text-anchor="middle">request comments</text></g>
<g class="n-agent"><rect class="sh" x="560" y="416" width="200" height="112" rx="8"/><text class="tag" x="660" y="438.07" text-anchor="middle">MODEL</text><text class="nt" x="660" y="456.93" text-anchor="middle">Stage agents</text><text class="nb" x="660" y="478.75" text-anchor="middle">change the specification</text><text class="nb" x="660" y="495.75" text-anchor="middle">only to carry in an answer</text><text class="nb" x="660" y="512.75" text-anchor="middle">or a changed meaning</text></g>
<text class="lb lb-flow" x="472" y="207.58" text-anchor="middle">only writer</text>
<text class="lb lb-flow" x="480" y="335.58" text-anchor="middle">writes the draft</text>
<text class="lb lb-dashed" x="472" y="397.58" text-anchor="middle">rewritten when a</text><text class="lb lb-dashed" x="472" y="412.58" text-anchor="middle">log entry changes</text><text class="lb lb-dashed" x="472" y="427.58" text-anchor="middle">the meaning</text>
<text class="lb lb-dashed" x="464" y="520.58" text-anchor="middle">intake carries</text><text class="lb lb-dashed" x="464" y="535.58" text-anchor="middle">in an answer</text>
<text class="lb lb-ask" x="495" y="735.58" text-anchor="middle">entry text, via the outcome</text>
<text class="lb lb-ask" x="600" y="767.58" text-anchor="middle">comments, copied by the factory</text>
<text class="lb lb-flow" x="600" y="799.58" text-anchor="middle">appends every entry</text>
