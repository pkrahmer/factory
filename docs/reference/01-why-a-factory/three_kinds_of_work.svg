<svg xmlns="http://www.w3.org/2000/svg" width="960" height="624" viewBox="0 0 960 624" role="img" aria-labelledby="title desc">
<title id="title">Three kinds of work</title>
<desc id="desc">A step in the work meets two questions. The first asks whether it decides what is wanted, or whether a result is accepted: if yes, it is intent and acceptance, and it belongs to the human. If not, the second asks whether there is exactly one right result that code can reach: if yes, it is bookkeeping, and it belongs to code; if no, it is judgment and writing, and it belongs to a model. Below the questions, three columns list the steps of chapter 1's health-endpoint story that fell to each owner. The human started the story, answered (a) and merged, because only the human holds the purpose and the accountability. A model judged whether the story was buildable, which tests and which code to write, whether it was good, what a reader must know and whether the output matched, because these have many acceptable results. Code kept the branches, the state, the commits, the posts, the checks, the counts and the bill, because each has one right result that must be exact and cheap.</desc>
