<svg xmlns="http://www.w3.org/2000/svg" width="850" height="912" viewBox="0 0 850 912" role="img" aria-labelledby="title desc">
<title id="title">The factory at a glance</title>
<desc id="desc">The human, at the top, works only through two places below: the repository, where they write and start stories, and the pull request, where they answer questions and merge or close. Below them, the factory's code runs on a schedule: a tick wakes it, the watcher reads both places and names the one next event, and the dispatcher handles that event, committing and pushing to the repository and opening, commenting on and marking ready the pull request. When a stage is due, the dispatcher starts a stage agent, the only place a model runs, which hands back an outcome and a log entry. A merge of the pull request lands on main. The human and the agents never talk directly.</desc>
