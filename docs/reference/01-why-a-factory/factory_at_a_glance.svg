<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="600" viewBox="0 0 1152 600" role="img" aria-labelledby="title desc">
<title id="title">The factory at a glance</title>
<desc id="desc">The human, on the left, works only through two places in the middle: the repository, where they write and start stories, and the pull request, where they answer questions and merge or close. On the right, the factory's code runs on a schedule: a tick wakes it, the watcher reads both places and names the one next event, and the dispatcher handles that event, committing and pushing to the repository and opening, commenting on and marking ready the pull request. When a stage is due, the dispatcher starts a stage agent, the only place a model runs, which hands back an outcome and a log entry. A merge of the pull request lands on main. The human and the agents never talk directly.</desc>
