<g class="n-agent"><rect class="sh" x="600" y="752" width="168" height="96" rx="8"/><text class="tag" x="684" y="774.57" text-anchor="middle">ACCEPTOR</text><text class="nt" x="684" y="793.43" text-anchor="middle"><tspan class="code">feature</tspan></text><text class="nb" x="684" y="815.25" text-anchor="middle">due when the</text><text class="nb" x="684" y="832.25" text-anchor="middle">feature is complete</text></g>
<g class="n-human"><rect class="sh" x="600" y="888" width="168" height="96" rx="8"/><text class="tag" x="684" y="910.57" text-anchor="middle">GATE</text><text class="nt" x="684" y="929.43" text-anchor="middle"><tspan class="code">accept</tspan></text><text class="nb" x="684" y="951.25" text-anchor="middle">the report's</text><text class="nb" x="684" y="968.25" text-anchor="middle">pull request</text></g>
