<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1160" viewBox="0 0 850 1160" role="img" aria-labelledby="title desc">
<title id="title">v1's stage machine</title>
<desc id="desc">v1's stage table as a state machine. A story runs down a vertical line: the human's draft, promoted to ready, then tests, doing, review, docs and demo, then the human's gate, accept, and when the human merges, done. Review, docs, demo and the human's close at the gate send the story back to doing, each at the cost of a round; doing can return it to tests after an approved test change, at no cost. From any stage between ready and demo, closing the pull request discards the story back to the drafts, and merging it moves the story straight to done. A question or a stall does not change the stage. At the bottom right, once per complete feature, the acceptor writes a report whose pull request the human merges, accepted, or closes, refused.</desc>
