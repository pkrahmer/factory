<g class="n-end"><rect class="sh" x="224" y="1032" width="176" height="64" rx="32"/><text class="nt" x="312" y="1058.43" text-anchor="middle"><tspan class="code">done</tspan></text><text class="nb" x="312" y="1080.25" text-anchor="middle">moved to <tspan class="code">done/</tspan></text></g>
<g class="n-ask"><rect class="sh" x="456" y="208" width="352" height="96" rx="8"/><text class="tag" x="632" y="230.57" text-anchor="middle">QUESTION</text><text class="nt" x="632" y="249.43" text-anchor="middle">A question</text><text class="nb" x="632" y="271.25" text-anchor="middle">any agent stage: <tspan class="code">blocked</tspan>, the stage stays;</text><text class="nb" x="632" y="288.25" text-anchor="middle">the answer runs it again</text></g>
