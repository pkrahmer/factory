<svg xmlns="http://www.w3.org/2000/svg" width="850" height="904" viewBox="0 0 850 904" role="img" aria-labelledby="title desc">
<title id="title">The machine</title>
<desc id="desc">The human configures the container once, with a .env file and a one-time Claude login, and afterwards acts only on GitHub, by merging and commenting. Inside the container, the entrypoint loop ticks each repository in turn. Each tick, factory-tick, starts at most one stage agent, claude -p, and then runs the project's checks with make. The tick fetches from and pushes to GitHub with git and gh, and reads and writes the checkout and the factory's state files in the work volume. The agent works in the same checkout and reads its agents, skills, settings and login from the claude-home volume; its model calls are the only traffic to the model provider. The image holds the factory's code and the tools, and the entrypoint copies agents, skills and settings from it into the claude-home volume at start. The image is replaced by a rebuild; both volumes survive one.</desc>
