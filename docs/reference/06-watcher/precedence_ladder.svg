<svg xmlns="http://www.w3.org/2000/svg" width="848" height="812" viewBox="0 0 848 812" role="img" aria-labelledby="title desc">
<title id="title">The order of events</title>
<desc id="desc">A ladder of seven rungs, read from the top. Each rung is a rule of the watcher with the events it can return, and the first rung that matches returns its event and ends the evaluation. Rungs one and two, corrections and integrity: an illegal stage change in the last commit returns reject, two work items with one identifier return duplicate. Rungs three and four, the human's signals: the pull request of the first waiting work item returns error pr-lookup, merged, closed or pr; a question recorded but not yet posted, or a gate without a pull request, returns ask. Rung five, the agent at work: a run record returns busy or expired. Rungs six and seven, new work: the lowest identifier in a stage with an agent returns ask when the attempts cap is reached, otherwise run; if nothing matched, the event is idle. The tick never handles busy, idle, and pr without new human comments. A waiting work item makes rung three match on every tick, so nothing below it runs.</desc>
