<g class="n-code"><rect class="sh" x="312" y="104" width="248" height="96" rx="8"/><text class="nt" x="436" y="129.43" text-anchor="middle">Prepare the branch</text><text class="nb" x="436" y="151.25" text-anchor="middle">first stage: create it, open a</text><text class="nb" x="436" y="168.25" text-anchor="middle">draft pull request</text><text class="nb" x="436" y="185.25" text-anchor="middle">else: fast-forward, merge <tspan class="code">main</tspan></text></g>
<g class="n-code"><rect class="sh" x="312" y="216" width="248" height="48" rx="8"/><text class="nt" x="436" y="244.93" text-anchor="middle">Validate the form</text></g>
<g class="n-code"><rect class="sh" x="312" y="280" width="248" height="48" rx="8"/><text class="nt" x="436" y="308.93" text-anchor="middle">Compose the task</text></g>
