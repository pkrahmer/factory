<g class="n-ask"><rect class="sh" x="656" y="1008" width="160" height="64" rx="32"/><text class="nt" x="736" y="1034.43" text-anchor="middle">Question</text><text class="nb" x="736" y="1056.25" text-anchor="middle"><tspan class="code">blocked: question</tspan></text></g>
<text class="tx-note" x="656" y="464" text-anchor="start">the only step where</text><text class="tx-note" x="656" y="481" text-anchor="start">a model runs</text>
<text class="lb lb-plain" x="272" y="152.58" text-anchor="middle">open the</text><text class="lb lb-plain" x="272" y="167.58" text-anchor="middle">draft</text>
<text class="lb lb-plain" x="272" y="204.58" text-anchor="middle">checkout,</text><text class="lb lb-plain" x="272" y="219.58" text-anchor="middle">merge</text>
<text class="lb lb-plain" x="290" y="367.58" text-anchor="middle">write</text>
<text class="lb lb-plain" x="290" y="551.58" text-anchor="middle">remove</text>
<text class="lb lb-stall" x="272" y="616.58" text-anchor="middle">agent left</text><text class="lb lb-stall" x="272" y="631.58" text-anchor="middle">the branch</text>
<text class="lb lb-plain" x="190" y="1095.58" text-anchor="middle">push</text>
<text class="lb lb-plain" x="190" y="1183.58" text-anchor="middle">description, ready</text>
<text class="lb lb-stall" x="640" y="204.58" text-anchor="start">cannot fast-forward</text><text class="lb lb-stall" x="640" y="219.58" text-anchor="start">or merge</text>
<text class="lb lb-stall" x="596" y="855.58" text-anchor="middle">not kept</text>
<text class="lb lb-stall" x="596" y="935.58" text-anchor="middle">form broke</text>
<text class="lb lb-stall" x="596" y="1003.58" text-anchor="middle">a check red</text>
<text class="lb lb-ask" x="608" y="1056.58" text-anchor="middle">question,</text><text class="lb lb-ask" x="608" y="1071.58" text-anchor="middle">form findings,</text><text class="lb lb-ask" x="608" y="1086.58" text-anchor="middle">round cap</text>
<text class="lb lb-plain" x="824" y="246.58" text-anchor="end">before</text><text class="lb lb-plain" x="824" y="261.58" text-anchor="end">the agent</text>
<text class="lb lb-plain" x="824" y="696.58" text-anchor="end">after</text><text class="lb lb-plain" x="824" y="711.58" text-anchor="end">the agent</text>
<g class="n-agent"><rect class="sh" x="656" y="1097.5" width="26" height="13" rx="3"/></g><text class="lg" x="690" y="1108" text-anchor="start">the agent</text>
<g class="n-code"><rect class="sh" x="656" y="1121.5" width="26" height="13" rx="3"/></g><text class="lg" x="690" y="1132" text-anchor="start">the factory's code</text>
<g class="n-ask"><rect class="sh" x="656" y="1145.5" width="26" height="13" rx="3"/></g><text class="lg" x="690" y="1156" text-anchor="start">question</text>
