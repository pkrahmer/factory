<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1272" viewBox="0 0 850 1272" role="img" aria-labelledby="title desc">
<title id="title">The stage protocol</title>
<desc id="desc">The steps of one stage run in v1, top to bottom: the factory's code prepares the branch (the first stage creates it and opens a draft pull request, a later one fast-forwards and merges main), validates the form, composes the task and writes the run record under .git. The agent, one box and the only model step, runs claude -p in its lane and ends with an outcome and an entry. The factory then removes the run record, verifies that the agent is still on the work item's branch (if not, a failure, counted and retried, the factory's fault), undoes every path changed outside the lane, restores the state and the log, reads the outcome, validates the form again and decides, then commits and pushes and hands over at a gate, all of it the factory's code. Git, the pull request and the run record sit on the left, written by the steps beside them. On the right, four lines end in a stall: the branch cannot be fast-forwarded or merged, the outcome is not kept, the form broke, a check is red. A question leaves the decision on its own.</desc>
