<g class="n-code"><rect class="sh" x="312" y="528" width="248" height="64" rx="8"/><text class="nt" x="436" y="554.43" text-anchor="middle">Remove the run record</text><text class="nb" x="436" y="576.25" text-anchor="middle">whatever happened</text></g>
<g class="n-code"><rect class="sh" x="312" y="608" width="248" height="64" rx="8"/><text class="nt" x="436" y="634.43" text-anchor="middle">Verify the branch</text><text class="nb" x="436" y="656.25" text-anchor="middle">still on the work item's branch?</text></g>
<g class="n-code"><rect class="sh" x="312" y="688" width="248" height="64" rx="8"/><text class="nt" x="436" y="714.43" text-anchor="middle">Undo outside the lane</text><text class="nb" x="436" y="736.25" text-anchor="middle">paths changed since the start commit</text></g>
<g class="n-code"><rect class="sh" x="312" y="768" width="248" height="48" rx="8"/><text class="nt" x="436" y="796.93" text-anchor="middle">Restore state and log</text></g>
<g class="n-code"><rect class="sh" x="312" y="832" width="248" height="64" rx="8"/><text class="nt" x="436" y="858.43" text-anchor="middle">Read the outcome</text><text class="nb" x="436" y="880.25" text-anchor="middle">allowed? <tspan class="code">stuck</tspan>? an error?</text></g>
<g class="n-code"><rect class="sh" x="312" y="912" width="248" height="64" rx="8"/><text class="nt" x="436" y="938.43" text-anchor="middle">Validate the form again</text><text class="nb" x="436" y="960.25" text-anchor="middle">a new finding is a stall</text></g>
<g class="n-code"><rect class="sh" x="312" y="992" width="248" height="64" rx="8"/><text class="nt" x="436" y="1018.43" text-anchor="middle">Decide</text><text class="nb" x="436" y="1040.25" text-anchor="middle">question · rework · checks, then move</text></g>
<g class="n-code"><rect class="sh" x="312" y="1072" width="248" height="64" rx="8"/><text class="nt" x="436" y="1098.43" text-anchor="middle">Commit and push</text><text class="nb" x="436" y="1120.25" text-anchor="middle"><tspan class="code">&lt;stage&gt; → &lt;next&gt;</tspan></text></g>
<g class="n-code"><rect class="sh" x="312" y="1152" width="248" height="80" rx="8"/><text class="nt" x="436" y="1177.93" text-anchor="middle">Hand over at a gate</text><text class="nb" x="436" y="1199.75" text-anchor="middle">the description from the story;</text><text class="nb" x="436" y="1216.75" text-anchor="middle">ready for review</text></g>
