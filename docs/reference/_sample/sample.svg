<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labeledby="title desc">
<title id="title">Sample · One story through the factory</title>
<desc id="desc">The human writes TICKET.md, which moves into intake. Intake, the coder and the reviewer are agents in the factory's container; the factory's verdict either passes the story to the human, who accepts it, or sends it back to the coder for rework. The coder can ask the human a question and stall on a red check.</desc>
