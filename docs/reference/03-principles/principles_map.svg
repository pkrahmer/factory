<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title desc">
<title id="title">Where the principles act</title>
<desc id="desc">The parts of the factory from Figure 1-1, each labeled with the principles that govern it. The human (P3, P4) starts and accepts, and acts in two places. The pull request (P4, P9) is the human's channel and where questions go. The repository (P2, P6, P8) is the only truth; the story in it is the memory and is specified down to the failing side. The factory's code is a group of three: the tick (P13) spends on events, not on time; the watcher (P5) takes the lowest identifier first and keeps the work in flight bounded; the dispatcher (P10, P11, P12, P14) enforces, observes, stops on the unknown and recovers. The stage agent below the dispatcher (P7, P9) does not judge its own work and asks instead of guessing. Unlabeled arrows orient the reader as in Figure 1-1: the human to the pull request and the repository, tick to watcher to dispatcher, dispatcher to agent and back, and the dispatcher to both places. A band below holds what belongs to the factory itself: the project contract (P15: control surface, lanes, project guide), the cost records (P16: every agent run measured) and the decision log (P17: why, and what was rejected). P1, sort every step, governs the whole picture: the boxes' colors are its three kinds of work, amber the human, blue a model, green code.</desc>
