<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1128" viewBox="0 0 850 1128" role="img" aria-labelledby="title desc">
<title id="title">Branches: one trunk, a short branch per work item</title>
<desc id="desc">Three vertical lanes, time running down: the story's branch ticket/&lt;file stem&gt; on the left, the trunk main in the middle, and the feature acceptance's branch acceptance/&lt;feature&gt; on the right. Each commit is a dot colored by who makes it: the human amber, the coder blue, the factory's code green. On main the human commits the drafts and FEATURE.md, then promotes the story with git mv into ongoing/. The story's branch leaves main at that promotion. Its first commit is the factory's: intake starts, with a draft pull request. The factory then commits ready to tests and tests to doing. Meanwhile the human commits another draft on main, so the factory merges main into the story's branch, only when main moved. The coder commits its work, feat, and a refactor if any. The factory commits doing to review, review to docs, docs to demo, and demo to accept, which marks the pull request ready. A bar beside the lane shows the pull request: draft from the first commit to the last, then ready until the human merges. The human merges the branch into main with a merge commit, never a squash, and the factory commits accept to done on main: the story is archived into done/ and its branch deleted. Once the feature's last story is archived, the acceptance's branch leaves main. The factory commits acceptance starts with a draft pull request, then feature to accept, which marks it ready. The human merges the report and its proposed drafts into main with a merge commit, and the factory commits accept to done with outcome accepted on main and deletes the branch.</desc>
