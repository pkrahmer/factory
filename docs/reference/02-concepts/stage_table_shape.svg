<g class="n-human"><path class="sh" d="M 68 104 H 208 L 224 120 V 212 Q 224 216 220 216 H 68 Q 64 216 64 212 V 108 Q 64 104 68 104 Z"/><path class="fold" d="M 208 104 V 118 Q 208 120 210 120 H 224 Z"/><text class="tag" x="144" y="134.57" text-anchor="middle">HUMAN · <tspan class="code">drafts/</tspan></text><text class="nt" x="144" y="153.43" text-anchor="middle">Draft</text><text class="nb" x="144" y="175.25" text-anchor="middle">the human's text;</text><text class="nb" x="144" y="192.25" text-anchor="middle">not worked on</text></g>
<g class="n-agent"><rect class="sh" x="296" y="104" width="160" height="112" rx="8"/><text class="tag" x="376" y="126.07" text-anchor="middle">INTAKE · <tspan class="code">ready</tspan></text><text class="nt" x="376" y="144.93" text-anchor="middle">Vet the story</text><text class="nb" x="376" y="166.75" text-anchor="middle">buildable? exact</text><text class="nb" x="376" y="183.75" text-anchor="middle">interface, testable</text><text class="nb" x="376" y="200.75" text-anchor="middle">criteria, failing sides</text></g>
<g class="n-agent"><rect class="sh" x="520" y="104" width="160" height="112" rx="8"/><text class="tag" x="600" y="134.57" text-anchor="middle">TESTER · <tspan class="code">tests</tspan></text><text class="nt" x="600" y="153.43" text-anchor="middle">Write the tests</text><text class="nb" x="600" y="175.25" text-anchor="middle">one test per criterion,</text><text class="nb" x="600" y="192.25" text-anchor="middle">red on purpose</text></g>
<g class="n-agent"><rect class="sh" x="64" y="336" width="160" height="112" rx="8"/><text class="tag" x="144" y="366.57" text-anchor="middle">CODER · <tspan class="code">doing</tspan></text><text class="nt" x="144" y="385.43" text-anchor="middle">Write the code</text><text class="nb" x="144" y="407.25" text-anchor="middle">until the full check</text><text class="nb" x="144" y="424.25" text-anchor="middle">is green; refactor once</text></g>
<g class="n-agent"><rect class="sh" x="296" y="336" width="160" height="112" rx="8"/><text class="tag" x="376" y="358.07" text-anchor="middle">REVIEWER · <tspan class="code">review</tspan></text><text class="nt" x="376" y="376.93" text-anchor="middle">Review</text><text class="nb" x="376" y="398.75" text-anchor="middle">the diff against the</text><text class="nb" x="376" y="415.75" text-anchor="middle">story and the</text><text class="nb" x="376" y="432.75" text-anchor="middle">architecture</text></g>
<g class="n-agent"><rect class="sh" x="520" y="336" width="160" height="112" rx="8"/><text class="tag" x="600" y="366.57" text-anchor="middle">DOCUMENTER · <tspan class="code">docs</tspan></text><text class="nt" x="600" y="385.43" text-anchor="middle">Document</text><text class="nb" x="600" y="407.25" text-anchor="middle">what the reader must</text><text class="nb" x="600" y="424.25" text-anchor="middle">know; stale text fixed</text></g>
<g class="n-agent"><rect class="sh" x="752" y="336" width="160" height="112" rx="8"/><text class="tag" x="832" y="358.07" text-anchor="middle">DEMO · <tspan class="code">demo</tspan></text><text class="nt" x="832" y="376.93" text-anchor="middle">Demonstrate</text><text class="nb" x="832" y="398.75" text-anchor="middle">run the commands,</text><text class="nb" x="832" y="415.75" text-anchor="middle">compare with the</text><text class="nb" x="832" y="432.75" text-anchor="middle">expected output</text></g>
<g class="n-human"><rect class="sh" x="976" y="336" width="160" height="112" rx="8"/><text class="tag" x="1056" y="366.57" text-anchor="middle">GATE · <tspan class="code">accept</tspan></text><text class="nt" x="1056" y="385.43" text-anchor="middle">Accept</text><text class="nb" x="1056" y="407.25" text-anchor="middle">the human merges,</text><text class="nb" x="1056" y="424.25" text-anchor="middle">or sends back</text></g>
<g class="n-ask"><rect class="sh" x="712" y="104" width="240" height="112" rx="56"/><text class="tag" x="832" y="126.07" text-anchor="middle">QUESTION</text><text class="nt" x="832" y="144.93" text-anchor="middle">The human answers</text><text class="nb" x="832" y="166.75" text-anchor="middle">from any working stage,</text><text class="nb" x="832" y="183.75" text-anchor="middle">on the pull request; the stage</text><text class="nb" x="832" y="200.75" text-anchor="middle">that asked runs again</text></g>
<g class="n-end"><rect class="sh" x="1000" y="128" width="112" height="64" rx="32"/><text class="tag" x="1056" y="153.57" text-anchor="middle"><tspan class="code">done</tspan></text><text class="nt" x="1056" y="172.43" text-anchor="middle">Archived</text></g>
