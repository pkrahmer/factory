  .g-stall { stroke: #e06c6c; }
  .n-end .sh { fill: #0f141a; stroke: #8b939e; }
  .n-end .fold { fill: #282d34; stroke: #8b939e; }
  .n-end .tag, .k-end { fill: #a2abb7; }
  .g-end { stroke: #8b939e; }
  .e-flow { stroke: #bcc4ce; } .ah-flow { fill: #bcc4ce; }
  .lb-flow { fill: #dfe6ee; }
  .e-back { stroke: #ef8a3c; } .ah-back { fill: #ef8a3c; }
  .lb-back { fill: #f6a96d; }
  .e-ask { stroke: #a98be0; } .ah-ask { fill: #a98be0; }
  .lb-ask { fill: #c4aef2; }
  .e-stall { stroke: #e06c6c; } .ah-stall { fill: #e06c6c; }
  .lb-stall { fill: #f29191; }
}
</style>
