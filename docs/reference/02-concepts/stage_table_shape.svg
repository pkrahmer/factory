<g class="n-human"><rect class="sh" x="133.22" y="1141.5" width="26" height="13" rx="3"/></g><text class="lg" x="167.22" y="1152" text-anchor="start">the human</text>
<g class="n-ask"><rect class="sh" x="254.19" y="1141.5" width="26" height="13" rx="3"/></g><text class="lg" x="288.19" y="1152" text-anchor="start">question</text>
<g class="n-end"><rect class="sh" x="363.37" y="1141.5" width="26" height="13" rx="3"/></g><text class="lg" x="397.37" y="1152" text-anchor="start">end</text>
