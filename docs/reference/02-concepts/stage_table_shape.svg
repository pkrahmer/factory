<g class="n-human"><path class="sh" d="M 100 104 H 432 L 448 120 V 172 Q 448 176 444 176 H 100 Q 96 176 96 172 V 108 Q 96 104 100 104 Z"/><path class="fold" d="M 432 104 V 118 Q 432 120 434 120 H 448 Z"/><text class="tag" x="272" y="123.07" text-anchor="middle">HUMAN · <tspan class="code">drafts/</tspan></text><text class="nt" x="272" y="141.93" text-anchor="middle">Draft</text><text class="nb" x="272" y="163.75" text-anchor="middle">the human's text; not worked on</text></g>
<g class="n-agent"><rect class="sh" x="96" y="216" width="352" height="96" rx="8"/><text class="tag" x="272" y="238.57" text-anchor="middle">INTAKE · <tspan class="code">ready</tspan></text><text class="nt" x="272" y="257.43" text-anchor="middle">Vet the story</text><text class="nb" x="272" y="279.25" text-anchor="middle">buildable? exact interface,</text><text class="nb" x="272" y="296.25" text-anchor="middle">testable criteria, failing sides</text></g>
<g class="n-agent"><rect class="sh" x="96" y="352" width="352" height="72" rx="8"/><text class="tag" x="272" y="371.07" text-anchor="middle">TESTER · <tspan class="code">tests</tspan></text><text class="nt" x="272" y="389.93" text-anchor="middle">Write the tests</text><text class="nb" x="272" y="411.75" text-anchor="middle">one test per criterion, red on purpose</text></g>
<g class="n-agent"><rect class="sh" x="96" y="472" width="352" height="72" rx="8"/><text class="tag" x="272" y="491.07" text-anchor="middle">CODER · <tspan class="code">doing</tspan></text><text class="nt" x="272" y="509.93" text-anchor="middle">Write the code</text><text class="nb" x="272" y="531.75" text-anchor="middle">until the full check is green; refactor once</text></g>
<g class="n-agent"><rect class="sh" x="96" y="584" width="352" height="72" rx="8"/><text class="tag" x="272" y="603.07" text-anchor="middle">REVIEWER · <tspan class="code">review</tspan></text><text class="nt" x="272" y="621.93" text-anchor="middle">Review</text><text class="nb" x="272" y="643.75" text-anchor="middle">the diff against the story and the architecture</text></g>
<g class="n-agent"><rect class="sh" x="96" y="696" width="352" height="72" rx="8"/><text class="tag" x="272" y="715.07" text-anchor="middle">DOCUMENTER · <tspan class="code">docs</tspan></text><text class="nt" x="272" y="733.93" text-anchor="middle">Document</text><text class="nb" x="272" y="755.75" text-anchor="middle">what the reader must know; stale text fixed</text></g>
<g class="n-agent"><rect class="sh" x="96" y="808" width="352" height="72" rx="8"/><text class="tag" x="272" y="827.07" text-anchor="middle">DEMO · <tspan class="code">demo</tspan></text><text class="nt" x="272" y="845.93" text-anchor="middle">Demonstrate</text><text class="nb" x="272" y="867.75" text-anchor="middle">run the commands, compare with the expected output</text></g>
<g class="n-human"><rect class="sh" x="96" y="944" width="352" height="72" rx="8"/><text class="tag" x="272" y="963.07" text-anchor="middle">GATE · <tspan class="code">accept</tspan></text><text class="nt" x="272" y="981.93" text-anchor="middle">Accept</text><text class="nb" x="272" y="1003.75" text-anchor="middle">the human merges, or sends back</text></g>
<g class="n-ask"><rect class="sh" x="544" y="208" width="256" height="112" rx="56"/><text class="tag" x="672" y="230.07" text-anchor="middle">QUESTION</text><text class="nt" x="672" y="248.93" text-anchor="middle">The human answers</text><text class="nb" x="672" y="270.75" text-anchor="middle">from any working stage,</text><text class="nb" x="672" y="287.75" text-anchor="middle">on the pull request; the stage</text><text class="nb" x="672" y="304.75" text-anchor="middle">that asked runs again</text></g>
<g class="n-end"><rect class="sh" x="216" y="1056" width="112" height="64" rx="32"/><text class="tag" x="272" y="1081.57" text-anchor="middle"><tspan class="code">done</tspan></text><text class="nt" x="272" y="1100.43" text-anchor="middle">Archived</text></g>
<text class="tx-note k-stall" x="163.74" y="930" text-anchor="middle">any stage before the gate</text>
<text class="lb lb-flow" x="280" y="200.08" text-anchor="start">promoted</text>
<text class="lb lb-flow" x="280" y="336.08" text-anchor="start">buildable</text>
<text class="lb lb-flow" x="280" y="568.08" text-anchor="start">checks green (full)</text>
<text class="lb lb-flow" x="280" y="680.08" text-anchor="start">no findings</text>
<text class="lb lb-flow" x="280" y="792.08" text-anchor="start">checks green (full)</text>
<text class="lb lb-flow" x="280" y="916.08" text-anchor="start">output as expected</text>
<text class="lb lb-flow" x="280" y="1040.08" text-anchor="start">merged</text>
<text class="lb lb-flow" x="240" y="452.08" text-anchor="end">checks green (lint)</text>
<text class="lb lb-back" x="570.75" y="611.58" text-anchor="middle">findings · round + 1</text>
<text class="lb lb-back" x="553.16" y="723.58" text-anchor="middle">code contradicts the story · round + 1</text>
<text class="lb lb-back" x="620.18" y="835.58" text-anchor="middle">output wrong · round + 1</text>
<text class="lb lb-back" x="631.38" y="971.58" text-anchor="middle">closed with a reason · round + 1</text>
<text class="lb lb-back" x="304" y="452.08" text-anchor="start">approved test change · no round</text>
<text class="lb lb-ask" x="497.17" y="239.58" text-anchor="middle">question</text>
<text class="lb lb-ask" x="497.17" y="296.58" text-anchor="middle">answer</text>
<text class="lb lb-stall" x="163.74" y="903.58" text-anchor="middle">closed before the gate: discarded</text>
