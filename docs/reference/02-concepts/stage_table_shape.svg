<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1200" viewBox="0 0 850 1200" role="img" aria-labelledby="title desc">
<title id="title">The shape of a stage table</title>
<desc id="desc">The general pattern of a stage table, drawn with v1's line. A story starts as the human's draft. Promoted, it passes the forward line, drawn as a column from top to bottom: check the story, write the tests, write the code, review, document, demonstrate, then the human's gate, and it is archived when merged. Review, documentation, demonstration and the human at the gate can send the story back to the coding stage, each at the cost of a round; the coding stage can return it to the tests stage after an approved test change, at no cost. Any working stage can ask the human a question, and the answer returns to the same stage. Closing the pull request before the gate discards the story back to the drafts. Each box names the stage, its role and v1's key for it.</desc>
<style>
text { font-family: "Inter", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.code { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.92em; }
.ttl { font-size: 20px; font-weight: 600; }
.sub { font-size: 13.5px; font-weight: 400; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; }
.nt { font-size: 14.5px; font-weight: 700; }
.nb { font-size: 12.5px; font-weight: 400; }
.lb { font-size: 12px; font-weight: 400; }
.lane-h { font-size: 13px; font-weight: 700; }
.lane-n { font-size: 12px; font-weight: 400; }
.col-h { font-size: 12.5px; font-weight: 700; }
.grp-c { font-size: 12px; font-weight: 600; }
.tx { font-size: 13px; font-weight: 400; }
.tx-bold { font-size: 13px; font-weight: 700; }
.tx-mono { font-size: 12px; font-weight: 400; font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.tx-note { font-size: 12px; font-weight: 400; }
.tx-small { font-size: 11px; font-weight: 400; }
.lg { font-size: 12px; font-weight: 400; }
.sh, .fold { stroke-width: 1.5; stroke-linejoin: round; }
.n-end .sh { stroke-dasharray: 5 3; }
.e { fill: none; stroke-linejoin: round; }
.lb { paint-order: stroke fill; stroke-width: 4px; stroke-linejoin: round; }
.rule, .lane-a, .lane-b { stroke-width: 1; shape-rendering: crispEdges; }
.rule, .col-u { fill: none; } .col-r { stroke-dasharray: 2 3; }
.col-u { stroke-width: 1; shape-rendering: crispEdges; }
.grp { stroke-width: 1; } .grp-d { stroke-dasharray: 5 4; }
.e-flow { stroke-width: 1.5; }
.e-back { stroke-width: 1.5; }
.e-ask { stroke-width: 1.5; stroke-dasharray: 6 4; }
.e-stall { stroke-width: 1.5; stroke-dasharray: 6 4; }
.bg { fill: #ffffff; }
.ttl, .nt, .lane-h, .col-h, .tx-bold { fill: #1b1f24; }
.sub, .lane-n, .grp-c, .tx-note, .tx-small { fill: #5d6470; }
.nb, .tx, .tx-mono, .lg { fill: #363b43; }
.lb { stroke: #ffffff; } .lb.on-lane { stroke: #f5f7f9; }
.lane-a { fill: #f5f7f9; stroke: #dde1e6; }
.lane-b { fill: #ffffff; stroke: #dde1e6; }
.rule { stroke: #dde1e6; }
.grp { fill: #ffffff; stroke: #b4bac3; } .col-u { stroke: #b4bac3; }
.n-agent .sh { fill: #eaf2fc; stroke: #2f6db5; }
.n-agent .fold { fill: #c5d7ee; stroke: #2f6db5; }
.n-agent .tag, .k-agent { fill: #2862a5; }
.g-agent { stroke: #2f6db5; }
.n-human .sh { fill: #fff4df; stroke: #c27400; }
.n-human .fold { fill: #f3dab2; stroke: #c27400; }
.n-human .tag, .k-human { fill: #965a00; }
.g-human { stroke: #c27400; }
.n-ask .sh { fill: #f3eefb; stroke: #7a4fb5; }
.n-ask .fold { fill: #dbceed; stroke: #7a4fb5; }
.n-ask .tag, .k-ask { fill: #673e9f; }
.g-ask { stroke: #7a4fb5; }
.n-stall .sh { fill: #fcecec; stroke: #b53a3a; }
.n-stall .fold { fill: #eec8c8; stroke: #b53a3a; }
.n-stall .tag, .k-stall { fill: #9f2d2d; }
.g-stall { stroke: #b53a3a; }
.n-end .sh { fill: #ffffff; stroke: #8a8f99; }
.n-end .fold { fill: #e8e9eb; stroke: #8a8f99; }
.n-end .tag, .k-end { fill: #5d6470; }
.g-end { stroke: #8a8f99; }
.e-flow { stroke: #4b515c; } .ah-flow { fill: #4b515c; }
.lb-flow { fill: #2b3038; }
.e-back { stroke: #d0661a; } .ah-back { fill: #d0661a; }
.lb-back { fill: #a64e0e; }
.e-ask { stroke: #7a4fb5; } .ah-ask { fill: #7a4fb5; }
.lb-ask { fill: #673e9f; }
.e-stall { stroke: #b53a3a; } .ah-stall { fill: #b53a3a; }
.lb-stall { fill: #9f2d2d; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0f141a; }
  .ttl, .nt, .lane-h, .col-h, .tx-bold { fill: #e6edf3; }
  .sub, .lane-n, .grp-c, .tx-note, .tx-small { fill: #9da7b3; }
  .nb, .tx, .tx-mono, .lg { fill: #c9d1d9; }
  .lb { stroke: #0f141a; } .lb.on-lane { stroke: #151b22; }
  .lane-a { fill: #151b22; stroke: #2a313b; }
  .lane-b { fill: #0f141a; stroke: #2a313b; }
  .rule { stroke: #2a313b; }
  .grp { fill: #0f141a; stroke: #3d4651; } .col-u { stroke: #3d4651; }
  .n-agent .sh { fill: #13263d; stroke: #5b9be6; }
  .n-agent .fold { fill: #213d5f; stroke: #5b9be6; }
  .n-agent .tag, .k-agent { fill: #8dbdf4; }
  .g-agent { stroke: #5b9be6; }
  .n-human .sh { fill: #33260f; stroke: #e0a33a; }
  .n-human .fold { fill: #563f18; stroke: #e0a33a; }
  .n-human .tag, .k-human { fill: #f2bd63; }
  .g-human { stroke: #e0a33a; }
  .n-ask .sh { fill: #251c38; stroke: #a98be0; }
  .n-ask .fold { fill: #3f325a; stroke: #a98be0; }
  .n-ask .tag, .k-ask { fill: #c4aef2; }
  .g-ask { stroke: #a98be0; }
  .n-stall .sh { fill: #371a1c; stroke: #e06c6c; }
  .n-stall .fold { fill: #592a2c; stroke: #e06c6c; }
  .n-stall .tag, .k-stall { fill: #f29191; }
  .g-stall { stroke: #e06c6c; }
  .n-end .sh { fill: #0f141a; stroke: #8b939e; }
  .n-end .fold { fill: #282d34; stroke: #8b939e; }
  .n-end .tag, .k-end { fill: #a2abb7; }
  .g-end { stroke: #8b939e; }
  .e-flow { stroke: #bcc4ce; } .ah-flow { fill: #bcc4ce; }
  .lb-flow { fill: #dfe6ee; }
  .e-back { stroke: #ef8a3c; } .ah-back { fill: #ef8a3c; }
  .lb-back { fill: #f6a96d; }
  .e-ask { stroke: #a98be0; } .ah-ask { fill: #a98be0; }
  .lb-ask { fill: #c4aef2; }
  .e-stall { stroke: #e06c6c; } .ah-stall { fill: #e06c6c; }
  .lb-stall { fill: #f29191; }
}
</style>
<defs><marker id="ah-flow" viewBox="0 0 10 10" refX="6.67" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-flow" d="M0.5 1 L10 5 L0.5 9 L2.6 5 Z"/></marker><marker id="ah-back" viewBox="0 0 10 10" refX="6.67" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-back" d="M0.5 1 L10 5 L0.5 9 L2.6 5 Z"/></marker><marker id="ah-ask" viewBox="0 0 10 10" refX="6.67" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-ask" d="M0.5 1 L10 5 L0.5 9 L2.6 5 Z"/></marker><marker id="ah-stall" viewBox="0 0 10 10" refX="6.67" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah-stall" d="M0.5 1 L10 5 L0.5 9 L2.6 5 Z"/></marker></defs>
<rect class="bg" width="850" height="1200"/>
<text class="ttl" x="40" y="48" text-anchor="start">The shape of a stage table</text>
<text class="sub" x="40" y="72" text-anchor="start">The general pattern, drawn with v1's line: forward to the human's gate, rework back to the code, questions to the human.</text>
