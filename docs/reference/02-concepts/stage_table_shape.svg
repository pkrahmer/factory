.code { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.92em; }
.ttl { font-size: 20px; font-weight: 600; }
.sub { font-size: 13.5px; font-weight: 400; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; }
.nt { font-size: 14.5px; font-weight: 700; }
.nb { font-size: 12.5px; font-weight: 400; }
.lb { font-size: 12px; font-weight: 400; }
.lane-h { font-size: 13px; font-weight: 700; }
.lane-n { font-size: 12px; font-weight: 400; }
.col-h { font-size: 12.5px; font-weight: 700; }
.grp-c { font-size: 12px; font-weight: 600; }
