<svg xmlns="http://www.w3.org/2000/svg" width="1176" height="680" viewBox="0 0 1176 680" role="img" aria-labelledby="title desc">
<title id="title">The shape of a stage table</title>
<desc id="desc">The general pattern of a stage table, drawn with v1's line. A story starts as the human's draft. Promoted, it passes the forward line: check the story, write the tests, write the code, review, document, demonstrate, then the human's gate, and it is archived when merged. The line wraps once, after the tests. Review, documentation, demonstration and the human at the gate can send the story back to the coding stage, each at the cost of a round; the coding stage can return it to the tests stage after an approved test change, at no cost. Any working stage can ask the human a question, and the answer returns to the same stage. Closing the pull request before the gate discards the story back to the drafts. Each box names the stage, its role and v1's key for it.</desc>
<style>
