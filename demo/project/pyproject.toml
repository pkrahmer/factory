[project]
name = "app"            # the repository carries the project name; the package stays generic
version = "0.1.0"
description = "Single-user to-do service, built by the factory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "httpx>=0.27",
    "import-linter>=2.0",
    "mutmut>=3.8.0",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --- Lint and format ---------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.md"]   # stories carry illustrative code blocks, not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PL", "C90", "S", "D"]
# Magic values are fine in small code; domain errors keep noun names; empty packages,
# magic methods and __init__ need no docstring.
ignore = ["PLR2004", "N818", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR0913", "D"]  # asserts and fixtures are the point of tests
# Docstrings are required where the interface is: domain and service. The edges (api,
# repository, __main__) keep the module docstring and are free otherwise.
"src/app/api/**" = ["D1"]
"src/app/repository/**" = ["D1"]
"src/app/__main__.py" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

# --- Types -------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# --- Layers ------------------------------------------------------------------
# Layers in parentheses are optional: the contract holds for the layers that exist, so it
# is in force from the first story on and every later layer falls under it when it arrives.
# Service and repository are independent siblings: neither may import the other.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["(app.api)", "(app.service) | (app.repository)", "(app.domain)"]

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

# --- Mutation testing (make mutants, outside the gate) --------------------------
[tool.mutmut]
source_paths = ["src/app/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["docs/"]   # a test reads docs/openapi.json beside the mutated copy

# --- SAST --------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
